<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화면 제목</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url("/_blob/e716050c98566c9e615f5e9d7d2cdbd6") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
button,.press{transition:transform 180ms cubic-bezier(.2,.8,.2,1),background-color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}button:active,.press:active{transform:scale(.96)}
</style>
</helmet>
<div style="width: 100%; min-height: 56px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-family: Pretendard, -apple-system, system-ui, sans-serif; color: #111111;">
  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
    <sc-if value="{{hasEyebrow}}" hint-placeholder-val="{{true}}">
      <span style="font-size: 13px; line-height: 19px; font-weight: 500; color: #6b7079;">{{eyebrow}}</span>
    </sc-if>
    <h1 style="margin: 0; font-size: 26px; line-height: 35px; font-weight: 600; letter-spacing: -0.5px;">{{title}}</h1>
  </div>
  <sc-if value="{{hasValue}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; align-items: flex-end;">
      <span style="font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -1.2px; font-variant-numeric: tabular-nums;">{{value}}<span style="color: #c4c8ce;">{{total}}</span></span>
      <sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 12px; line-height: 16px; color: #6b7079;">{{note}}</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{hasAction}}" hint-placeholder-val="{{false}}">
    <a href="{{actionHref}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border-radius: 999px; background: #111111; color: #ffffff; font-size: 15px; font-weight: 500; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{actionLabel}}
    </a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"eyebrow":{"editor":"text","default":"11월 11일 수요일"},"title":{"editor":"text","default":"오늘의 루틴"},"value":{"editor":"text","default":""},"total":{"editor":"text","default":""},"note":{"editor":"text","default":""},"actionLabel":{"editor":"text","default":""},"actionHref":{"editor":"text","default":""},"$preview":{"width":350,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const value = p.value ?? '';
    const eyebrow = p.eyebrow ?? '11월 11일 수요일';
    return {
      eyebrow: eyebrow,
      hasEyebrow: !!eyebrow,
      title: p.title ?? '오늘의 루틴',
      value: value,
      hasValue: value !== '' && value !== null,
      total: p.total ?? '',
      note: p.note ?? '',
      hasNote: !!p.note,
      actionLabel: p.actionLabel ?? '',
      actionHref: p.actionHref ?? '',
      hasAction: !!p.actionLabel
    };
  }
}
</script>
</body>
</html>
