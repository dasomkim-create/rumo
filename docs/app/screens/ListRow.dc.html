<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목록 행</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url("/_blob/e716050c98566c9e615f5e9d7d2cdbd6") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
button,.press{transition:transform 180ms cubic-bezier(.2,.8,.2,1),background-color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}button:active,.press:active{transform:scale(.96)}
</style>
</helmet>
<div style="width: 100%; font-family: Pretendard, -apple-system, system-ui, sans-serif; color: #111111; background: #ffffff;">
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}">
    <a href="{{href}}" style="position: relative; display: flex; align-items: center; gap: 14px; min-height: {{minH}}; color: #111111; text-decoration: none;">
      <img src="{{icon}}" alt="" style="width: 28px; height: 28px; flex: none;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
        <span style="font-size: 17px; line-height: 24px; font-weight: 500; letter-spacing: -0.2px;">{{title}}</span>
        <sc-if value="{{hasSub}}" hint-placeholder-val="{{true}}">
          <span style="font-size: 13px; line-height: 19px; color: {{subColor}};">{{sub}}</span>
        </sc-if>
      </span>
      <span style="font-size: 15px; line-height: 22px; color: #6b7079; font-variant-numeric: tabular-nums;">{{trailText}}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#afb4bb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      <sc-if value="{{hasLine}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: absolute; left: 42px; right: 0; bottom: 0; height: 1px; background: #e9ebee;"></span></sc-if>
    </a>
  </sc-if>
  <sc-if value="{{noHref}}" hint-placeholder-val="{{true}}">
    <div style="position: relative; display: flex; align-items: center; gap: 14px; min-height: {{minH}};">
      <img src="{{icon}}" alt="" style="width: 28px; height: 28px; flex: none;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
        <span style="font-size: 17px; line-height: 24px; font-weight: 500; letter-spacing: -0.2px;">{{title}}</span>
        <sc-if value="{{hasSub}}" hint-placeholder-val="{{true}}">
          <span style="font-size: 13px; line-height: 19px; color: {{subColor}};">{{sub}}</span>
        </sc-if>
      </div>
      <sc-if value="{{isCheck}}" hint-placeholder-val="{{false}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </sc-if>
      <sc-if value="{{isText}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 15px; line-height: 22px; color: #6b7079; font-variant-numeric: tabular-nums;">{{trailText}}</span>
      </sc-if>
      <sc-if value="{{isButton}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{toggle}}" aria-pressed="{{checked}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; background: {{btnBg}}; color: {{btnFg}};">{{btnText}}</button>
      </sc-if>
      <sc-if value="{{isSwitch}}" hint-placeholder-val="{{false}}">
        <button type="button" role="switch" aria-checked="{{checked}}" aria-label="{{title}}" onClick="{{toggle}}" style="width: 51px; height: 31px; flex: none; border: 0; border-radius: 999px; padding: 2px; cursor: pointer; display: flex; background: {{swTrack}}; transition: background-color 220ms ease;">
          <span style="width: 27px; height: 27px; border-radius: 999px; background: #ffffff; display: block; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); transform: {{swKnob}}; transition: transform 260ms cubic-bezier(.3,1.3,.5,1);"></span>
        </button>
      </sc-if>
      <sc-if value="{{isInput}}" hint-placeholder-val="{{false}}">
        <input id="{{inputId}}" type="text" value="{{value}}" aria-label="{{title}}" style="width: 120px; height: 36px; box-sizing: border-box; border: 0; background: transparent; padding: 0; text-align: right; font-family: inherit; font-size: 17px; color: #111111;">
      </sc-if>
      <sc-if value="{{hasLine}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: absolute; left: 42px; right: 0; bottom: 0; height: 1px; background: #e9ebee;"></span></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"text","default":"/_blob/56f7bbd221e0dbea56b60be13f10a06b"},"title":{"editor":"text","default":"항목"},"sub":{"editor":"text","default":"보조 설명"},"subColor":{"editor":"color","default":"#6b7079"},"trail":{"editor":"enum","options":["none","check","text","button","switch","input"],"default":"switch"},"trailText":{"editor":"text","default":""},"href":{"editor":"text","default":""},"on":{"editor":"boolean","default":false},"onText":{"editor":"text","default":"허용됨"},"offText":{"editor":"text","default":"허용"},"inputId":{"editor":"text","default":"row-input"},"value":{"editor":"text","default":""},"divider":{"editor":"boolean","default":false},"$preview":{"width":350,"height":64}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: !!props.on };
  }
  renderVals() {
    const p = this.props;
    const trail = p.trail ?? 'switch';
    const on = this.state.on;
    const sub = p.sub ?? '보조 설명';
    return {
      icon: p.icon ?? '/_blob/56f7bbd221e0dbea56b60be13f10a06b',
      title: p.title ?? '항목',
      sub: sub,
      hasSub: !!sub,
      subColor: p.subColor ?? '#6b7079',
      href: p.href ?? '',
      hasHref: !!p.href,
      noHref: !p.href,
      trailText: p.trailText ?? '',
      isCheck: trail === 'check',
      isText: trail === 'text',
      isButton: trail === 'button',
      isSwitch: trail === 'switch',
      isInput: trail === 'input',
      checked: on ? 'true' : 'false',
      btnText: on ? (p.onText ?? '허용됨') : (p.offText ?? '허용'),
      btnBg: on ? '#f3f4f6' : '#111111',
      btnFg: on ? '#6b7079' : '#ffffff',
      swKnob: on ? 'translateX(20px)' : 'none',
      swTrack: on ? '#111111' : '#e4e6ea',
      toggle: () => this.setState({ on: !on }),
      inputId: p.inputId ?? 'row-input',
      value: p.value ?? '',
      hasLine: p.divider === true,
      minH: '60px'
    };
  }
}
</script>
</body>
</html>
