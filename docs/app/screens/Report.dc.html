<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RUMO 기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url("/_blob/e716050c98566c9e615f5e9d7d2cdbd6") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
@keyframes rumo-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise>*{animation:rumo-in 560ms cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:60ms}.rise>*:nth-child(3){animation-delay:120ms}.rise>*:nth-child(4){animation-delay:180ms}.rise>*:nth-child(5){animation-delay:240ms}.rise>*:nth-child(6){animation-delay:300ms}.rise>*:nth-child(7){animation-delay:360ms}.rise>*:nth-child(8){animation-delay:420ms}.rise>*:nth-child(9){animation-delay:480ms}
@media (prefers-reduced-motion: reduce){.rise>*{animation:none!important}}
a{color:#5b3fe0}a:hover{color:#3d24b8}
.scroll{scrollbar-width:none;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}
button,.press{transition:transform 180ms cubic-bezier(.2,.8,.2,1),background-color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}button:active,.press:active{transform:scale(.96)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #ffffff; color: #111111; font-family: Pretendard, -apple-system, system-ui, sans-serif;">
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding-bottom: 120px;">
  <div class="rise" style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 20px;">
    <dc-import name="Segmented" labels="영양제|건강" hrefs="Report.dc.html|Health.dc.html" active="{{zero}}" hint-size="100%,40px"></dc-import>
    <dc-import name="ScreenHeader" eyebrow="11월 9일 – 15일" title="이번 주" value="15" total="/18" note="이번 주 지금까지" hint-size="100%,60px"></dc-import>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: grid; grid-template-columns: 32px repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; line-height: 16px; color: #6b7079; text-align: center; padding-bottom: 2px;">
        <span></span><span>월</span><span>화</span><span style="color: #111111; font-weight: 600;">수</span><span>목</span><span>금</span><span>토</span><span>일</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 32px repeat(7, minmax(0, 1fr)); gap: 4px; align-items: center;">
          <img src="{{r.icon}}" alt="{{r.name}}" style="width: 26px; height: 26px;">
          <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="7">
            <div title="{{c.title}}" style="aspect-ratio: 1; border-radius: 3px; background: {{c.bg}}; box-shadow: {{c.ring}};"></div>
          </sc-for>
        </div>
      </sc-for>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; line-height: 16px; color: #6b7079;">
        <span style="display: inline-flex; align-items: center; gap: 6px;"><i style="width: 12px; height: 12px; border-radius: 2px; background: #72e5b5;"></i>먹었어</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><i style="width: 12px; height: 12px; border-radius: 2px; background: #ff6a32;"></i>놓침</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><i style="width: 12px; height: 12px; border-radius: 2px; background: #ffe3f6; box-shadow: inset 0 0 0 2px #ff64cf;"></i>지금</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><i style="width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px #d3d6db;"></i>예정</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <dc-import name="SectionHeader" label="어떻게 확인했나요" hint-size="100%,23px"></dc-import>
      <sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: 72px minmax(0, 1fr) 24px; gap: 10px; align-items: center; min-height: 36px; font-size: 15px; line-height: 22px;">
          <span>{{s.label}}</span>
          <div style="height: 8px; border-radius: 999px; background: #f3f4f6; overflow: hidden;">
            <div style="height: 8px; border-radius: 999px; width: {{s.w}}; background: {{s.color}};"></div>
          </div>
          <span style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 500;">{{s.n}}</span>
        </div>
      </sc-for>
      <dc-import name="ListRow" icon="/_blob/090e19df98d02b97d3da074df29f0464" title="오메가3 4일분 남았어요" sub="다 떨어지기 전에 루모가 알려줄게요" trail="button" off-text="알림 받기" on-text="알림 켜짐" hint-size="100%,60px"></dc-import>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start;">
      <img src="/_blob/56f7bbd221e0dbea56b60be13f10a06b" alt="" style="width: 28px; height: 28px; flex: none;">
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #30343b;">이번 주는 말로 챙긴 게 제일 많았어. 화요일에 루테인이랑 마그네슘을 놓쳤으니까 오늘 밤엔 한 번 더 물어볼게.</p>
    </div>
  </div>

  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px;">
    <dc-import name="TabBar" active="report" hint-size="100%,66px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = {
      d: { bg: '#72e5b5', ring: 'none', title: '먹었어' },
      m: { bg: '#ff6a32', ring: 'none', title: '놓침' },
      n: { bg: '#ffe3f6', ring: 'inset 0 0 0 2px #ff64cf', title: '지금' },
      f: { bg: '#ffffff', ring: 'inset 0 0 0 1px #d3d6db', title: '예정' }
    };
    const row = (name, icon, codes) => ({ name, icon, cells: codes.split('').map((k) => C[k]) });
    const rows = [
      row('유산균', '/_blob/56f7bbd221e0dbea56b60be13f10a06b', 'dddffff'),
      row('비타민D', '/_blob/4f09d3617e69995832560c4998771e80', 'dddffff'),
      row('루테인', '/_blob/5e9761d53e7178469e1b8d82893baf92', 'dmdffff'),
      row('오메가3', '/_blob/090e19df98d02b97d3da074df29f0464', 'ddnffff'),
      row('칼슘', '/_blob/add37f25abe7a4e4585156f9d9e852dd', 'ddfffff'),
      row('마그네슘', '/_blob/d513e23a477d5280f5568955d8cc67f2', 'dmfffff')
    ];
    const max = 8;
    const sources = [
      { label: '음성', n: 8 },
      { label: '체크 타일', n: 4 },
      { label: '워치', n: 2 },
      { label: '앱', n: 1 }
    ].map((s, i) => Object.assign({}, s, { w: Math.round((s.n / max) * 100) + '%', color: i === 0 ? 'linear-gradient(90deg, #ff9ee2 0%, #ffc96b 100%)' : 'linear-gradient(90deg, #eceef1 0%, #dbdee3 100%)' }));
    return { rows, sources, zero: 0 };
  }
}
</script>
</body>
</html>
