<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D = ['월', '화', '수', '목', '금', '토', '오늘'];
    const V = [64, 58, 70, 74, 69, 81, 78];
    const week = V.map((v, i) => {
      const today = i === 6;
      return {
        day: D[i], v: String(v),
        h: Math.round((v / 100) * 92) + 'px',
        c: today ? 'linear-gradient(180deg, #ff9ee2 0%, #ffc96b 100%)' : 'linear-gradient(180deg, #eceef1 0%, #f4f5f7 100%)',
        tc: today ? '#111111' : '#6b7079',
        fw: today ? '600' : '400',
        delay: (i * 50) + 'ms'
      };
    });
    const S = [7.0, 5.7, 7.5, 6.8, 7.2, 8.1, 7.3];
    const sleep = S.map((h, i) => ({
      h: Math.round((h / 10) * 100) + 'px',
      c: h < 6.5 ? 'linear-gradient(180deg, #ff6a32 0%, #ffa27d 100%)' : (i === 6 ? 'linear-gradient(180deg, #ff9ee2 0%, #ffc96b 100%)' : 'linear-gradient(180deg, #eceef1 0%, #f4f5f7 100%)'),
      t: D[i] + ' ' + Math.floor(h) + '시간 ' + Math.round((h % 1) * 60) + '분',
      delay: (i * 50) + 'ms'
    }));
    return { week, sleep, one: 1, no: false };
  }
}
</script>
