<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내비게이션 바</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url("/_blob/e716050c98566c9e615f5e9d7d2cdbd6") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
button,.press{transition:transform 180ms cubic-bezier(.2,.8,.2,1),background-color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}button:active,.press:active{transform:scale(.96)}
</style>
</helmet>
<div style="width: 100%; height: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; font-family: Pretendard, -apple-system, system-ui, sans-serif; color: #111111;">
  <a href="{{back}}" style="justify-self: start; display: inline-flex; align-items: center; gap: 2px; margin-left: -6px; color: #111111; font-size: 17px; line-height: 24px; text-decoration: none;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>{{backLabel}}
  </a>
  <span style="text-align: center; font-size: 17px; line-height: 24px; font-weight: 600;">{{title}}</span>
  <span style="text-align: right; font-size: 13px; line-height: 19px; font-weight: 500; color: #6b7079; font-variant-numeric: tabular-nums;">{{step}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"back":{"editor":"text","default":"Main.dc.html"},"backLabel":{"editor":"text","default":"이전"},"title":{"editor":"text","default":""},"step":{"editor":"text","default":""},"$preview":{"width":350,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { back: p.back ?? 'Main.dc.html', backLabel: p.backLabel ?? '이전', title: p.title ?? '', step: p.step ?? '' };
  }
}
</script>
</body>
</html>
