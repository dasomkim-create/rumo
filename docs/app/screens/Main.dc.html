<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["normal","offline","empty"],"default":"normal"},"taken":{"editor":"text","default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const t = (props.taken || '').split(',').filter(Boolean);
    const done = { probiotic: true, vitd: true, lutein: true, omega: false, calcium: false, magnesium: false };
    t.forEach((id) => { done[id] = true; });
    this.state = { retrying: false, done, snoozed: false, last: t.length ? t[t.length - 1] : null };
  }
  componentDidMount() { if (this.state.last) this.armToast(); }
  componentWillUnmount() { clearTimeout(this.tt); clearTimeout(this.ct); }
  armToast(extra) { clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ last: null }), 5000 + (extra || 0)); }
  take(id) { clearTimeout(this.ct); this.setState({ done: Object.assign({}, this.state.done, { [id]: true }), last: id, snoozed: false, cel: id }); this.ct = setTimeout(() => this.setState({ cel: null }), 2000); this.armToast(2000); }
  renderVals() {
    const mode = this.props.mode ?? 'normal';
    const off = mode === 'offline';
    const empty = mode === 'empty';
    const d = this.state.done;
    const all = [
      { id: 'probiotic', title: '유산균', time: '08:00', icon: '/_blob/56f7bbd221e0dbea56b60be13f10a06b', now: false },
      { id: 'vitd', title: '비타민D', time: '08:00', icon: '/_blob/4f09d3617e69995832560c4998771e80', now: false },
      { id: 'lutein', title: '루테인', time: '12:30', icon: '/_blob/5e9761d53e7178469e1b8d82893baf92', now: false },
      { id: 'omega', title: '오메가3', time: '20:00', icon: '/_blob/090e19df98d02b97d3da074df29f0464', now: true },
      { id: 'calcium', title: '칼슘', time: '21:00', icon: '/_blob/add37f25abe7a4e4585156f9d9e852dd', now: false },
      { id: 'magnesium', title: '마그네슘', time: '22:30', icon: '/_blob/d513e23a477d5280f5568955d8cc67f2', now: false }
    ];
    const list = empty ? [] : all;
    const tiles = list.map((m) => ({
      title: m.title, time: m.time, icon: m.icon,
      state: d[m.id] ? 'done' : (m.now ? 'now' : 'wait'),
      toggle: () => (d[m.id] ? this.setState({ done: Object.assign({}, d, { [m.id]: false }), last: null }) : this.take(m.id))
    }));
    const doneCount = String(list.filter((m) => d[m.id]).length);
    const sn = this.state.snoozed;
    const pending = list.filter((m) => !d[m.id]);
    const nowItem = pending.find((m) => m.now);
    const nx = nowItem ? null : pending[0];
    return {
      tiles, doneCount,
      hasMeds: !empty, isEmpty: empty, isOffline: off,
      chipLabel: off ? '루모 · 연결 끊김' : '루모 · 거실에 있어요', chipTone: off ? 'soft' : 'plain',
      totalLabel: '/' + list.length,
      offlineNote: this.state.retrying ? '루모를 찾는 중이에요…' : '알림은 폰으로 대신 보내요 · 기록은 그대로예요',
      retryLabel: this.state.retrying ? '찾는 중…' : '다시 연결',
      retry: () => this.setState({ retrying: !this.state.retrying }),
      showNow: !!nowItem, showNext: !nowItem && !!nx, showAll: !empty && pending.length === 0,
      next: nx ? { title: nx.title, time: nx.time, icon: nx.icon, take: () => this.take(nx.id) } : { title: '', time: '', icon: '', take: () => {} },
      nowNote: sn ? '20:30에 다시 알려드릴게요' : (off ? '1알 · 물과 함께 · 루모 대신 폰으로 알렸어요' : '1알 · 물과 함께 · 루모가 방금 말했어요'),
      snoozeLabel: sn ? '미룸 취소' : '30분 뒤',
      nowChip: sn ? '미룸 · 20:30' : '지금 · 20:00', nowTone: sn ? 'snooze' : 'now',
      takeNow: () => { if (nowItem) this.take(nowItem.id); },
      hasToast: !!this.state.last,
      celebrating: !!this.state.cel,
      celName: ((list.find((m) => m.id === this.state.cel) || { title: '' }).title) + ' · 방금',
      celIcon: (list.find((m) => m.id === this.state.cel) || { icon: '' }).icon,
      toastDelay: this.state.cel ? '1700ms' : '0ms',
      toast: (list.find((m) => m.id === this.state.last) || { title: '' }).title + ' 먹었어요',
      undo: () => { const id = this.state.last; if (!id) return; clearTimeout(this.tt); clearTimeout(this.ct); this.setState({ done: Object.assign({}, d, { [id]: false }), last: null, cel: null }); },
      snooze: () => this.setState({ snoozed: !sn })
    };
  }
}
</script>
