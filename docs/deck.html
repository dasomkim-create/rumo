<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUMO 브랜드 장표</title>
<style>
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Pretendard,-apple-system,system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9;object-fit:contain;display:block;opacity:0;transition:opacity 260ms ease}
.stage img.on{opacity:1}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:opacity 200ms ease}
body:hover .bar,.bar:focus-within{opacity:1}
@media (hover:none){.bar{opacity:1}}
.btn{width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.22)}
.num{font-variant-numeric:tabular-nums;font-size:15px;color:#a3a3a3}.num b{color:#fff}
.tap{position:fixed;top:0;bottom:80px;width:35%;cursor:pointer}.tap.l{left:0}.tap.r{right:0}
</style>
</head>
<body>
<div class="stage"><img id="slide" alt="" src="img/slide-01.jpg" class="on"></div>
<div class="tap l" id="tl" aria-hidden="true"></div><div class="tap r" id="tr" aria-hidden="true"></div>
<nav class="bar" aria-label="장표 넘기기">
  <a class="btn" href="index.html" aria-label="사이트로 돌아가기">✕</a>
  <span class="num" aria-live="polite"><b id="cur">01</b> / 17</span>
  <span style="display:flex;gap:8px"><button class="btn" id="prev" aria-label="이전 장">‹</button><button class="btn" id="next" aria-label="다음 장">›</button></span>
</nav>
<script>
(function(){
  var N=17, i=1, img=document.getElementById('slide'), cur=document.getElementById('cur');
  var names=['Cover', 'Philosophy', 'Positioning', 'Persona', 'Family', 'Journey', 'Meet Rumo', 'Expressions', 'How it works', 'Logo', 'Logo guide', 'Logo color', 'Symbols', 'Color', 'Type', 'Voice', 'MVP demo'];
  for (var k=1;k<=N;k++){ var pre=new Image(); pre.src='img/slide-'+String(k).padStart(2,'0')+'.jpg'; }
  function show(n){ i=Math.max(1,Math.min(N,n)); img.classList.remove('on');
    setTimeout(function(){ img.src='img/slide-'+String(i).padStart(2,'0')+'.jpg'; img.alt=names[i-1]+' 장표'; img.classList.add('on'); },120);
    cur.textContent=String(i).padStart(2,'0'); if (location.hash!=='#'+i) history.replaceState(null,'','#'+i); }
  document.getElementById('prev').onclick=function(){show(i-1)};
  document.getElementById('next').onclick=function(){show(i+1)};
  document.getElementById('tl').onclick=function(){show(i-1)};
  document.getElementById('tr').onclick=function(){show(i+1)};
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')show(i+1); if(e.key==='ArrowLeft'||e.key==='PageUp')show(i-1); if(e.key==='Escape')location.href='index.html'; });
  var x0=null; document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){ if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40)show(i+(dx<0?1:-1)); x0=null; });
  var h=parseInt(location.hash.slice(1),10); show(isNaN(h)?1:h);
})();
</script>
</body>
</html>
