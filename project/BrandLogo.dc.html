<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { const v = this._rv() || {}; v.showFoot = this.props.embed !== true && this.props.embed !== 'true'; return v; }
  constructor(props) {
    super(props);
    this.state = { hover: -1, play: true };
  }
  _rv() {
    const C = [
      { no: '01', title: '한 두께, 한 높이', desc: '획 20, 높이 100, 같은 기준선. 세 글자가 한 규칙이라 어느 글자도 튀지 않아요.' },
      { no: '02', title: '별처럼 핀 꽃', desc: '여섯 꽃잎을 15° 돌려 별표(*)처럼. 꽃잎은 32로 글자보다 도톰하게.' },
      { no: '03', title: '천천히 도는 o', desc: '꽃만 14초에 한 바퀴. 로고가 등장할 땐 흩어진 글자가 모이고 꽃이 피어요.' },
      { no: '04', title: '체크는 시스템으로', desc: '로고에선 덜어내고 앱 아이콘 구석, 체크 타일, 패키지 패턴에서 써요.' }
    ];
    const h = this.state.hover;
    const dim = 0.15;
    return {
      typeOp: h === 1 || h === 2 ? dim : 1,
      flowerOp: h === 0 || h === 3 ? dim : 1,
      petalOp: h === 1 ? 1 : 0,
      gridOp: h === 0 ? 1 : 0,
      cards: C.map((c, i) => Object.assign({}, c, { line: h === i ? '#ffffff' : '#333333', enter: () => this.setState({ hover: i }) })),
      leave: () => this.setState({ hover: -1 }),
      play: this.state.play,
      replay: () => { this.setState({ play: false }); setTimeout(() => this.setState({ play: true }), 60); }
    };
  }
}
</script>
