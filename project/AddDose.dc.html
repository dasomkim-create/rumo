      sheetCta: S[cur].label + ' 표식으로 할게요',
      no: false,
      prod: { name: pp.name, short: pp.short, icon: pp.icon, sub: pp.brand + ' · ' + pp.dose + ' · 성분은 자동으로 채웠어요' },
      pSheet: this.state.pSheet, pq: this.state.pq,
      openProduct: () => this.setState({ pSheet: true }),
      closeProduct: () => this.setState({ pSheet: false }),
      onPq: (e) => this.setState({ pq: e && e.target ? e.target.value : '' }),
      listTitle: pq ? ('"' + pq + '" 검색 결과 ' + hits.length + '개') : '지금 많이 등록하는 영양제',
      noResult: hits.length === 0,
      results: hits.map(([p, i]) => ({ name: p.name, brand: p.brand, dose: p.dose, icon: p.icon, tag: pq ? (i === this.state.prod ? '선택됨' : '') : p.tag, tagColor: i === this.state.prod && pq ? '#111111' : '#1f9d68', pick: () => this.setState({ prod: i, pSheet: false, pq: '' }) })),
      ingr: ING.map(([l, ic]) => ({ label: l, icon: ic, pressed: pq === l ? 'true' : 'false', bg: pq === l ? '#111111' : '#f3f4f6', fg: pq === l ? '#ffffff' : '#111111', pick: () => this.setState({ pq: pq === l ? '' : l }) })),
      isEdit: this.edit, navTitle: this.edit ? '영양제 수정' : '영양제 등록', navBack: this.edit ? 'Meds.dc.html' : 'Connect.dc.html', navStep: this.edit ? '' : '2 / 2',
      ctaLabel: this.edit ? '저장' : '등록하기', ctaHref: this.edit ? 'Meds.dc.html' : 'Main.dc.html',
      askDelete: this.state.del, showDelete: !this.state.del,
      startDelete: () => this.setState({ del: true }), cancelDelete: () => this.setState({ del: false }),
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      onSearch: (v) => this.setState({ q: typeof v === 'string' ? v : (v && v.target ? v.target.value : '') })
    };
  }
}
</script>
</body>
</html>
