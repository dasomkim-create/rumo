class Component extends DCLogic {
  constructor(props) {

  renderVals() {
    const u = this.state.undone;
    return {
      title: u ? '기록을 되돌렸어요' : '오늘도 챙겼다!',

      undoLabel: u ? '다시 기록하기' : '되돌리기',
      undo: () => this.setState({ undone: !u })
    };
  }
}
